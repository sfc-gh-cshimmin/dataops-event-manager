[project]
name = "dataops-event-manager"
version = "1.0.0"
description = "Streamlit app for managing DataOps.live events — fork repos, create events, and approve deployments."
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.50.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "snowflake-connector-python>=3.0.0",
    "snowflake-snowpark-python>=1.0.0",
]
